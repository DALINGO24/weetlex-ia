<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Weetlex — AI</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root {
  --bg: #080810; --s1: #0e0e1a; --s2: #13131f; --s3: #1a1a28;
  --border: rgba(255,255,255,.07); --border2: rgba(255,255,255,.12);
  --accent: #818cf8; --accent-dim: rgba(129,140,248,.15);
  --green: #10b981; --red: #f87171;
  --text: #e2e2ee; --sub: #9191a8; --muted: #52526a;
  --font-serif: 'Instrument Serif', Georgia, serif;
  --font-sans: 'Geist', system-ui, sans-serif;
  --r: 12px; --sidebar: 256px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; display: flex; }

/* ── LOGIN ── */
#loginScreen {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px;
}
.login-card {
  background: var(--s1); border: 1px solid var(--border2); border-radius: 24px;
  padding: 48px 40px; width: 100%; max-width: 420px; text-align: center;
  position: relative; overflow: hidden;
  box-shadow: 0 0 80px rgba(129,140,248,.08), 0 40px 80px rgba(0,0,0,.4);
  animation: cardIn .5s cubic-bezier(.22,1,.36,1) both;
}
@keyframes cardIn { from{opacity:0;transform:translateY(24px) scale(.97);}to{opacity:1;transform:none;} }
.login-card::before {
  content:''; position:absolute; top:-60px; left:50%; transform:translateX(-50%);
  width:240px; height:240px;
  background:radial-gradient(circle, rgba(129,140,248,.18) 0%, transparent 70%); pointer-events:none;
}
.login-logo {
  font-family:var(--font-serif); font-size:15px; letter-spacing:.12em;
  color:var(--sub); text-transform:uppercase; margin-bottom:32px;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.login-logo .dot { width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent); }
.login-heading { font-family:var(--font-serif); font-size:36px; font-weight:400; color:var(--text); line-height:1.15; margin-bottom:10px; }
.login-sub { font-size:14px; color:var(--sub); margin-bottom:36px; line-height:1.6; }
.name-input-wrap { margin-bottom:14px; }
.name-input-wrap input {
  width:100%; background:var(--s2); border:1.5px solid var(--border2); border-radius:var(--r);
  padding:14px 18px; font-family:var(--font-sans); font-size:16px; color:var(--text);
  outline:none; transition:border-color .2s,box-shadow .2s; text-align:center;
}
.name-input-wrap input::placeholder { color:var(--muted); }
.name-input-wrap input:focus { border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-dim); }
.login-btn {
  width:100%; padding:14px; background:var(--accent); border:none; border-radius:var(--r);
  color:#fff; font-family:var(--font-sans); font-size:15px; font-weight:600; cursor:pointer;
  transition:filter .2s,transform .15s,opacity .2s; position:relative; overflow:hidden;
}
.login-btn::after { content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15) 0%,transparent 60%); }
.login-btn:hover { filter:brightness(1.12); transform:translateY(-1px); }
.login-btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }
.login-terms { margin-top:20px; font-size:12px; color:var(--muted); line-height:1.5; }

/* ── APP ── */
#app { display:none; width:100%; height:100dvh; }
#app.visible { display:flex; }

/* ── SIDEBAR ── */
.sidebar { width:var(--sidebar); background:var(--s1); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
.sidebar-top { padding:20px 16px 16px; border-bottom:1px solid var(--border); }
.logo { display:flex; align-items:center; gap:9px; margin-bottom:16px; }
.logo-mark { width:28px;height:28px; background:linear-gradient(135deg,var(--accent),#6366f1); border-radius:7px; display:grid; place-items:center; font-size:13px; flex-shrink:0; }
.logo-name { font-family:var(--font-serif); font-size:17px; color:var(--text); }
.logo-badge { font-size:9px; background:var(--accent-dim); border:1px solid var(--accent); color:var(--accent); border-radius:20px; padding:1px 6px; font-weight:600; margin-left:auto; }
.new-btn { width:100%; background:var(--s2); border:1px solid var(--border2); border-radius:8px; padding:9px 12px; color:var(--text); font-family:var(--font-sans); font-size:13px; cursor:pointer; display:flex; align-items:center; gap:7px; transition:background .15s,border-color .15s; }
.new-btn:hover { background:var(--s3); border-color:var(--accent); }
.new-btn svg { color:var(--accent); }
.sidebar-label { padding:14px 16px 6px; font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
.history { flex:1; overflow-y:auto; padding:4px 8px; }
.history::-webkit-scrollbar { width:3px; }
.history::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
.hist-item { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; cursor:pointer; font-size:13px; color:var(--sub); transition:background .15s,color .15s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hist-item:hover { background:var(--s3); color:var(--text); }
.hist-item.active { background:var(--accent-dim); color:var(--text); }
.hist-item svg { flex-shrink:0; opacity:.5; }
.sidebar-footer { padding:12px 16px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:8px; }
.user-chip { display:flex; align-items:center; gap:10px; padding:8px 10px; background:var(--s2); border-radius:8px; border:1px solid var(--border); }
.user-avatar { width:28px;height:28px; border-radius:50%; background:linear-gradient(135deg,var(--accent),#818cf8cc); display:grid; place-items:center; font-family:var(--font-serif); font-size:13px; color:#fff; flex-shrink:0; }
.user-name-chip { font-size:13px; font-weight:500; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.logout-btn { background:none; border:none; color:var(--muted); cursor:pointer; padding:3px; border-radius:4px; display:grid; place-items:center; transition:color .2s; }
.logout-btn:hover { color:var(--red); }
.status-row { display:flex; align-items:center; gap:7px; font-size:11px; color:var(--sub); }
.status-dot { width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 5px var(--green);flex-shrink:0; }

/* ── MAIN ── */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; position:relative; background:var(--bg); }
.topbar { padding:12px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; background:rgba(8,8,16,.85); backdrop-filter:blur(12px); flex-shrink:0; }
.model-pill { display:flex; align-items:center; gap:8px; background:var(--s2); border:1px solid var(--border2); border-radius:20px; padding:6px 14px; font-size:13px; color:var(--text); }
.model-pill .dot { width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 5px var(--green); }
.top-actions { display:flex; gap:6px; }
.t-btn { background:var(--s2); border:1px solid var(--border); border-radius:8px; padding:7px 9px; color:var(--sub); cursor:pointer; display:grid; place-items:center; transition:color .2s,border-color .2s; }
.t-btn:hover { color:var(--text); border-color:var(--accent); }

/* ── MESSAGES ── */
.msgs { flex:1; overflow-y:auto; padding:24px 0; display:flex; flex-direction:column; scroll-behavior:smooth; }
.msgs::-webkit-scrollbar { width:4px; }
.msgs::-webkit-scrollbar-thumb { background:var(--s3); border-radius:4px; }
.msgs-inner { max-width:740px; width:100%; margin:0 auto; padding:0 24px; display:flex; flex-direction:column; }

/* ── WELCOME ── */
.welcome { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 0 20px; text-align:center; gap:20px; animation:fadeUp .5s ease both; }
@keyframes fadeUp { from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;} }
.welcome-greeting { font-family:var(--font-serif); font-size:38px; font-weight:400; font-style:italic; color:var(--text); line-height:1.2; }
.welcome-greeting span { color:var(--accent); font-style:normal; }
.welcome-sub { font-size:14px; color:var(--sub); max-width:380px; line-height:1.65; }
.chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:540px; }
.chip { background:var(--s2); border:1px solid var(--border2); border-radius:20px; padding:8px 16px; font-size:13px; color:var(--sub); cursor:pointer; transition:background .15s,border-color .15s,color .15s; white-space:nowrap; }
.chip:hover { background:var(--accent-dim); border-color:var(--accent); color:var(--text); }

/* ── MSG ROWS ── */
.msg-row { display:flex; gap:12px; padding:14px 0; animation:fadeUp .3s ease both; }
.msg-row.user { flex-direction:row-reverse; }
.av { width:32px;height:32px; border-radius:50%; display:grid; place-items:center; font-size:13px; flex-shrink:0; margin-top:2px; }
.av.ai { background:linear-gradient(135deg,#818cf8,#6366f1); }
.av.user { background:var(--s3); border:1px solid var(--border2); font-family:var(--font-serif); color:var(--accent); font-weight:700; }
.bubble-wrap { flex:1; min-width:0; }
.bubble { display:inline-block; max-width:100%; padding:12px 16px; border-radius:var(--r); line-height:1.7; font-size:14.5px; word-break:break-word; }
.bubble.ai { background:var(--s1); border:1px solid var(--border); border-top-left-radius:3px; display:block; }
.bubble.user { background:var(--accent-dim); border:1px solid rgba(129,140,248,.25); border-top-right-radius:3px; color:var(--text); float:right; clear:both; }
.bubble p { margin-bottom:10px; } .bubble p:last-child { margin-bottom:0; }
.bubble ul,.bubble ol { padding-left:20px; margin:8px 0; display:flex; flex-direction:column; gap:3px; }
.bubble strong { color:#fff; font-weight:600; }
.bubble em { font-style:italic; color:var(--sub); }
.bubble h1,.bubble h2,.bubble h3 { font-family:var(--font-serif); font-weight:400; margin:14px 0 6px; }
.bubble h1{font-size:20px;} .bubble h2{font-size:17px;} .bubble h3{font-size:15px;}
.bubble pre { background:#060611; border:1px solid var(--border); border-radius:8px; overflow:hidden; margin:10px 0; }
.pre-hdr { display:flex; justify-content:space-between; align-items:center; padding:5px 12px; background:#0c0c18; border-bottom:1px solid var(--border); font-size:11px; color:var(--muted); font-family:monospace; }
.copy-code { background:none; border:1px solid var(--border); border-radius:4px; color:var(--muted); font-size:10px; padding:2px 7px; cursor:pointer; transition:color .2s,border-color .2s; }
.copy-code:hover { color:var(--text); border-color:var(--accent); }
.bubble pre code { display:block; padding:14px 16px; overflow-x:auto; font-size:12.5px; line-height:1.6; }
.bubble code:not(pre code) { background:rgba(129,140,248,.12); padding:2px 6px; border-radius:4px; font-size:13px; color:#a5b4fc; }
.msg-meta { display:flex; align-items:center; gap:6px; margin-top:6px; opacity:0; transition:opacity .2s; }
.msg-row:hover .msg-meta { opacity:1; }
.meta-btn { background:none; border:1px solid var(--border); border-radius:5px; padding:3px 8px; font-size:11px; color:var(--muted); cursor:pointer; display:flex; align-items:center; gap:4px; transition:color .2s,border-color .2s; }
.meta-btn:hover { color:var(--text); border-color:var(--accent); }
.typing-wrap { display:flex; align-items:center; gap:4px; padding:5px 0; }
.t-dot { width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.4s infinite; }
.t-dot:nth-child(2){animation-delay:.2s;} .t-dot:nth-child(3){animation-delay:.4s;}
@keyframes pulse{0%,80%,100%{opacity:.25;transform:scale(.75);}40%{opacity:1;transform:scale(1);}}

/* ── INPUT ── */
.input-section { padding:12px 24px 18px; background:rgba(8,8,16,.9); border-top:1px solid var(--border); flex-shrink:0; }
.input-box { max-width:740px; margin:0 auto; background:var(--s1); border:1.5px solid var(--border2); border-radius:16px; transition:border-color .2s,box-shadow .2s; }
.input-box:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }
.input-row { display:flex; align-items:flex-end; padding:10px 10px 10px 14px; gap:8px; }
textarea#inp { flex:1;background:none;border:none;outline:none; color:var(--text);font-family:var(--font-sans); font-size:14.5px;line-height:1.55; resize:none;max-height:160px; padding:4px 0; overflow-y:auto; }
textarea#inp::placeholder { color:var(--muted); }
.send-btn { width:36px;height:36px; background:var(--accent); border:none;border-radius:10px; color:#fff;cursor:pointer; display:grid;place-items:center; transition:filter .2s,transform .15s,opacity .2s; flex-shrink:0; }
.send-btn:hover { filter:brightness(1.15); transform:translateY(-1px); }
.send-btn:disabled { opacity:.3;cursor:not-allowed;transform:none; }
.hint { text-align:center;font-size:11px;color:var(--muted); margin-top:8px; }
.scroll-fab { position:absolute;right:24px;bottom:120px; background:var(--s2);border:1px solid var(--border2); border-radius:50%;width:34px;height:34px; display:none;place-items:center;cursor:pointer; color:var(--sub);z-index:10; }
.scroll-fab.show { display:grid; }

@media(max-width:660px){
  .sidebar{display:none;}
  .input-section{padding:10px 12px 16px;}
  .msgs-inner{padding:0 12px;}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <div class="dot"></div>Weetlex AI<div class="dot"></div>
    </div>
    <h1 class="login-heading">Hola,<br>¿cómo te llamas?</h1>
    <p class="login-sub">Escribe tu nombre y <strong style="color:var(--accent)">Weetlex</strong> te dará la bienvenida.<br>No necesitas contraseña.</p>
    <div class="name-input-wrap">
      <input type="text" id="nameInput" placeholder="Tu nombre…" maxlength="32"
        onkeydown="if(event.key==='Enter')doLogin()"
        oninput="document.getElementById('loginBtn').disabled=!this.value.trim()"/>
    </div>
    <button class="login-btn" id="loginBtn" onclick="doLogin()" disabled>Entrar al chat</button>
    <p class="login-terms">Las respuestas son generadas por inteligencia artificial.</p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="logo">
        <div class="logo-mark">✦</div>
        <span class="logo-name">Weetlex</span>
        <span class="logo-badge">PRO</span>
      </div>
      <button class="new-btn" onclick="newChat()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nueva conversación
      </button>
    </div>
    <div class="sidebar-label">Historial</div>
    <div class="history" id="history"></div>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar" id="sidebarAvatar"></div>
        <span class="user-name-chip" id="sidebarName"></span>
        <button class="logout-btn" onclick="doLogout()" title="Salir">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
      <div class="status-row">
        <div class="status-dot"></div>
        <span>Weetlex · En línea</span>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="model-pill"><div class="dot"></div>Weetlex AI</div>
      <div class="top-actions">
        <button class="t-btn" title="Nueva conversación" onclick="newChat()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </div>
    </div>

    <div class="msgs" id="msgs" onscroll="onScroll()">
      <div class="msgs-inner" id="msgsInner"></div>
    </div>

    <button class="scroll-fab" id="scrollFab" onclick="scrollBottom()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
    </button>

    <div class="input-section">
      <div class="input-box">
        <div class="input-row">
          <textarea id="inp" rows="1" placeholder="Escribe tu mensaje…"
            onkeydown="handleKey(event)"
            oninput="autoResize(this);toggleSend()"></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMsg()" disabled>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
      <p class="hint">Weetlex AI · Respuestas generadas por inteligencia artificial</p>
    </div>
  </main>
</div>

<script>
// ── ESTADO ──────────────────────────────
let userName = '';
let messages = [];
let isStreaming = false;
let isFirst = true;

// ── DOM ─────────────────────────────────
const loginScreen = document.getElementById('loginScreen');
const app         = document.getElementById('app');
const nameInput   = document.getElementById('nameInput');
const msgsEl      = document.getElementById('msgs');
const msgsInner   = document.getElementById('msgsInner');
const inp         = document.getElementById('inp');
const sendBtn     = document.getElementById('sendBtn');
const historyEl   = document.getElementById('history');
const scrollFab   = document.getElementById('scrollFab');

// ── LOGIN ────────────────────────────────
function doLogin() {
  const n = nameInput.value.trim();
  if (!n) return;
  userName = n; isFirst = true;
  document.getElementById('sidebarName').textContent = n;
  document.getElementById('sidebarAvatar').textContent = n[0].toUpperCase();
  loginScreen.style.animation = 'cardIn .3s cubic-bezier(.22,1,.36,1) reverse both';
  setTimeout(() => {
    loginScreen.style.display = 'none';
    app.classList.add('visible');
    showWelcome();
    inp.focus();
  }, 280);
}

function doLogout() {
  userName = ''; messages = []; isFirst = true;
  app.classList.remove('visible');
  loginScreen.style.display = 'flex';
  loginScreen.style.animation = 'cardIn .4s cubic-bezier(.22,1,.36,1) both';
  nameInput.value = '';
  document.getElementById('loginBtn').disabled = true;
  msgsInner.innerHTML = ''; historyEl.innerHTML = '';
}

// ── WELCOME ──────────────────────────────
function showWelcome() {
  msgsInner.innerHTML = '';
  const h = new Date().getHours();
  const saludo = h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
  const sugs = [
    'Explícame machine learning con ejemplos',
    'Escribe código Python para análisis de datos',
    'Redacta un correo profesional',
    'Dame ideas creativas para mi proyecto',
    'Resuelve este problema de matemáticas',
    'Traduce y mejora este texto',
  ];
  const w = document.createElement('div');
  w.className = 'welcome'; w.id = 'welcomeEl';
  w.innerHTML = `
    <div class="welcome-greeting">${saludo},<br><span>${escH(userName)}</span></div>
    <p class="welcome-sub">Soy <strong>Weetlex</strong>, tu asistente de IA. Pregúntame lo que necesites.</p>
    <div class="chips">${sugs.map(s=>`<div class="chip" onclick="sendSug('${s.replace(/'/g,"\\'")}')">
      ${escH(s)}</div>`).join('')}</div>`;
  msgsInner.appendChild(w);
}

function sendSug(t) { inp.value = t; autoResize(inp); toggleSend(); sendMsg(); }

// ── INPUT ────────────────────────────────
function autoResize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,160)+'px'; }
function toggleSend() { sendBtn.disabled = !inp.value.trim() || isStreaming; }
function handleKey(e) { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); if(!sendBtn.disabled) sendMsg(); } }

// ── SCROLL ───────────────────────────────
function scrollBottom() { msgsEl.scrollTo({top:msgsEl.scrollHeight,behavior:'smooth'}); }
function onScroll() {
  const d = msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight;
  scrollFab.classList.toggle('show', d > 180);
}

// ── HELPERS ──────────────────────────────
function escH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fmtMd(text) {
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const l = lang || 'plaintext';
    let hi;
    try { hi = hljs.getLanguage(l) ? hljs.highlight(code.trim(),{language:l}).value : escH(code.trim()); }
    catch(e){ hi = escH(code.trim()); }
    return `<pre><div class="pre-hdr"><span>${l}</span><button class="copy-code" onclick="cpCode(this)">Copiar</button></div><code class="hljs">${hi}</code></pre>`;
  });
  text = text.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  text = text.replace(/\*\*(.+?)\*\*/gs,'<strong>$1</strong>');
  text = text.replace(/\*(.+?)\*/g,'<em>$1</em>');
  text = text.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  text = text.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  text = text.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  text = text.replace(/^[\-\*] (.+)$/gm,'<li>$1</li>').replace(/(<li>[\s\S]*?<\/li>(\n|$))+/g,'<ul>$&</ul>');
  return text.split(/\n\n+/).map(p => {
    p=p.trim(); if(!p) return '';
    if(/^<(h[1-3]|ul|ol|pre|li)/.test(p)) return p;
    return `<p>${p.replace(/\n/g,'<br>')}</p>`;
  }).join('');
}

function addRow(role, html, streaming=false) {
  const w = document.getElementById('welcomeEl');
  if(w) w.remove();
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;
  const av = role==='user' ? (userName[0]||'U').toUpperCase() : '✦';
  const content = streaming
    ? `<div class="typing-wrap"><div class="t-dot"></div><div class="t-dot"></div><div class="t-dot"></div></div>`
    : html;
  row.innerHTML = `
    <div class="av ${role}">${av}</div>
    <div class="bubble-wrap">
      <div class="bubble ${role}">${content}</div>
      <div class="msg-meta">
        <button class="meta-btn" onclick="cpBubble(this)">Copiar</button>
        ${role==='ai'?`<button class="meta-btn" onclick="regen(this)">Regenerar</button>`:''}
      </div>
    </div>`;
  msgsInner.appendChild(row);
  scrollBottom();
  return row;
}

// ── SEND ─────────────────────────────────
async function sendMsg() {
  const text = inp.value.trim();
  if (!text || isStreaming) return;

  addRow('user', escH(text));
  messages.push({ role:'user', content: text });

  inp.value=''; inp.style.height='auto'; toggleSend();
  isStreaming=true; toggleSend();

  const aiRow = addRow('ai','',true);
  const bubble = aiRow.querySelector('.bubble.ai');

  try {
    // Llama a tu propio backend en /api/chat (esconde la API key)
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: messages,
        userName: userName,
        isFirst: isFirst
      })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Error del servidor');

    const aiText = data.text || 'Sin respuesta.';
    messages.push({ role:'assistant', content: aiText });
    bubble.innerHTML = fmtMd(aiText);
    isFirst = false;
    updateHistory(text);

  } catch(err) {
    bubble.innerHTML = `<span style="color:var(--red)">⚠ ${escH(err.message)}</span>`;
  }

  isStreaming=false; toggleSend(); scrollBottom();
}

// ── HISTORIA ─────────────────────────────
function updateHistory(msg) {
  const title = msg.slice(0,36)+(msg.length>36?'…':'');
  const ex = historyEl.querySelector('.hist-item.active');
  if(ex){ ex.querySelector('span').textContent=title; return; }
  const it = document.createElement('div');
  it.className='hist-item active';
  it.innerHTML=`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>${escH(title)}</span>`;
  historyEl.prepend(it);
}

// ── NEW CHAT ─────────────────────────────
function newChat() {
  if(isStreaming) return;
  messages=[]; isFirst=true;
  historyEl.querySelectorAll('.hist-item').forEach(i=>i.classList.remove('active'));
  showWelcome(); inp.value=''; inp.style.height='auto'; toggleSend(); inp.focus();
}

// ── COPY ─────────────────────────────────
function cpBubble(btn) {
  const t = btn.closest('.bubble-wrap').querySelector('.bubble').innerText;
  navigator.clipboard.writeText(t).then(()=>{ btn.textContent='✓ Copiado'; setTimeout(()=>btn.textContent='Copiar',2000); });
}
function cpCode(btn) {
  const c = btn.closest('pre').querySelector('code').innerText;
  navigator.clipboard.writeText(c).then(()=>{ btn.textContent='✓'; setTimeout(()=>btn.textContent='Copiar',2000); });
}

// ── REGENERAR ────────────────────────────
async function regen(btn) {
  if(isStreaming) return;
  const row = btn.closest('.msg-row'); row.remove();
  messages = messages.slice(0, messages.findLastIndex(m=>m.role==='assistant'));
  isStreaming=true; toggleSend();
  const aiRow = addRow('ai','',true);
  const bubble = aiRow.querySelector('.bubble.ai');
  try {
    const res = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ messages, userName })
    });
    const data = await res.json();
    const aiText = data.text||'Sin respuesta.';
    messages.push({role:'assistant',content:aiText});
    bubble.innerHTML = fmtMd(aiText);
  } catch(err) {
    bubble.innerHTML=`<span style="color:var(--red)">⚠ ${escH(err.message)}</span>`;
  }
  isStreaming=false; toggleSend(); scrollBottom();
}

nameInput.focus();
